<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Partner API · Kutubxona.uz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  :root { --accent:#F08418; --ink:#2B2B2B; --ink-2:#5A564F; --ink-3:#8B857B; --line:#E5E0D7; --page:#F2EEE8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .brand { font-weight:800; letter-spacing:-.02em; font-size:18px; }
  .brand b { color:var(--accent); }
  .who { color:var(--ink-2); font-size:13px; }
  .top form { margin-left:auto; }
  .top button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  .wrap { max-width:1700px; margin:0 auto; padding:22px 28px; }
  .swagger-ui .wrapper { max-width:100%; padding:0 24px; }
  .tokens { background:#fffaf4; border:1px solid #f0c9a0; border-radius:12px; padding:16px 18px; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; }
  .row label { width:64px; color:var(--ink-3); font-size:12px; flex-shrink:0; }
  textarea { flex:1; width:100%; font-family:ui-monospace, Menlo, monospace; font-size:12px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fafaf8; color:var(--ink); display:block; resize:vertical; word-break:break-all; }
  .cp { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; white-space:nowrap; }
  .cp:hover { border-color:var(--accent); color:var(--accent); }
  .meta { font-size:12.5px; color:var(--ink-2); margin:8px 0 0; }
  .meta code { font-family:ui-monospace, Menlo, monospace; font-size:12px; background:#f3efe8; padding:1px 5px; border-radius:4px; }
  #swagger { background:#fff; border:1px solid var(--line); border-radius:12px; margin-top:16px; }
  .swagger-ui .topbar { display:none; }
  .swagger-ui .info { margin:18px 0; }
  .swagger-ui .scheme-container { display:none; }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Kutubxona<b>.UZ</b> <span style="font-weight:500; color:var(--ink-3)">· Partner API</span></div>
  <div class="who">{{ client.name }}</div>
  <form method="post" action="{{ logout_url }}">{% csrf_token %}<button type="submit">Chiqish</button></form>
</div>

<div class="wrap">
  <!-- Tokenlar -->
  <div class="tokens">
    <div class="row"><label>access</label><textarea id="acc" rows="2" readonly>{{ tokens.access }}</textarea><button class="cp" onclick="cp('acc',this)">Copy</button></div>
    <div class="row"><label>refresh</label><textarea id="ref" rows="2" readonly>{{ tokens.refresh }}</textarea><button class="cp" onclick="cp('ref',this)">Copy</button></div>
  </div>

  <!-- drf-spectacular Swagger UI — faqat 3 ta hamkor endpointi -->
  <div id="swagger"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
<script>
  var ACCESS = document.getElementById('acc').value.trim();

  window.ui = SwaggerUIBundle({
    url: "{{ schema_url }}",
    dom_id: "#swagger",
    deepLinking: false,
    docExpansion: "list",
    tryItOutEnabled: true,
    displayRequestDuration: true,
    defaultModelsExpandDepth: -1,
    requestInterceptor: function (req) {
      if (!req.headers['Authorization'] && !req.headers['authorization']) {
        req.headers['Authorization'] = 'Bearer ' + ACCESS;
      }
      return req;
    },
    onComplete: function () {
      try { window.ui.preauthorizeApiKey('partnerAuth', ACCESS); } catch (e) {}
    }
  });

  function cp(id, btn) {
    var el = document.getElementById(id);
    el.select(); el.setSelectionRange(0, 999999);
    try { navigator.clipboard.writeText(el.value); } catch (e) { document.execCommand('copy'); }
    var old = btn.textContent; btn.textContent = '✓';
    setTimeout(function () { btn.textContent = old; }, 1200);
  }
</script>
</body>
</html>
